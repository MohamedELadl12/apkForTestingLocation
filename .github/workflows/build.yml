steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Install system dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y --no-install-recommends \
        build-essential git unzip zlib1g-dev libncurses5 libffi-dev libssl-dev python3-dev \
        pkg-config autoconf automake libtool curl wget zip

  - name: Setup Python and Buildozer
    run: |
      python3 -m pip install --upgrade pip
      pip install buildozer cython

  - name: Build APK with Buildozer
    run: |
      cd ${{ github.workspace }}
      # Adjust the target (android debug/release) as needed
      buildozer -v android debug

  - name: Upload APK Artifact
    uses: actions/upload-artifact@v4
    with:
      name: python-kivy-apk
      path: bin/*.apk